[project]
name = "Smarts"
version = "0.1.0"
description = "Language Server Client for Sublime Text"
readme = "README.md"
requires-python = "~=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "ty>=0.0.1a34",
]

[tool.ty.environment]
extra-paths = ["/Applications/Sublime Text.app/Contents/MacOS/Lib/python314"]
python-version = "3.14"
root = [".."]

[tool.ruff.lint]
ignore = ["BLE001", "SIM102", "I001"]
